apiVersion: apps/v1
kind: Deployment
metadata:
  name: whereami
spec:
  selector:
    matchLabels:
      app: whereami
  replicas: 1
  template:
    metadata:
      labels:
        app: whereami
    spec:
      containers:
        - name: whereami
          image: "whereami:latest"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: infra-config
                  key: rmq-url
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: infra-config
                  key: rmq-port
            - name: WHEREAMI_VIN
              value: D2S-DEMO-VIN-000
            - name: SIMULATOR_BASE_URL
              value: http://simulator-vehicle-0:8080
            - name: WHEREAMI_POLL_INTERVAL
              value: 1s
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "160Mi"
              cpu: "100m"
            limits:
              memory: "320Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: whereami
spec:
  type: ClusterIP
  selector:
    app: whereami
  ports:
    - port: 8080
      targetPort: 8080
      name: http
