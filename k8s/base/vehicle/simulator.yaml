apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
spec:
  selector:
    matchLabels:
      app: simulator
  replicas: 1
  template:
    metadata:
      labels:
        app: simulator
    spec:
      containers:
        - name: simulator
          image: "simulator:latest"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: infra-config
                  key: rmq-url
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: infra-config
                  key: rmq-port
            - name: SIMULATOR_VIN
              value: D2S-DEMO-VIN-000
            - name: SIMULATOR_POSITION
              value: "0"
            - name: SIMULATOR_STATE_PUBLISH_INTERVAL
              value: 500ms
            - name: SIMULATOR_PEER_STATE_MAX_AGE_SECONDS
              value: "3"
            - name: SIMULATOR_STATE_QUEUE_NAME
              value: simulator.state.vehicle-0
            - name: SIMULATOR_SCENARIO_QUEUE_NAME
              value: simulator.scenario.vehicle-0
            - name: SIMULATOR_BRAKENOW_BRAKE_QUEUE_NAME
              value: simulator.brakenow.brake.vehicle-0
            - name: SIMULATOR_BRAKENOW_BRAKE_ROUTING_KEY
              value: brake.D2S-DEMO-VIN-000
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "160Mi"
              cpu: "100m"
            limits:
              memory: "320Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: simulator
spec:
  type: ClusterIP
  selector:
    app: simulator
  ports:
    - port: 8080
      targetPort: 8080
      name: http
