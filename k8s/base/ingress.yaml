apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: d2s-ingress
# All traffic is routed to storefront. The storefront nginx container then
# internally proxies /api/ → spider and /stomp → rabbitmq WebSocket,
# so there is no CORS problem and only one external endpoint is needed.
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  number: 80
