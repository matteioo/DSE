apiVersion: apps/v1
kind: Deployment
metadata:
  name: utracked
spec:
  selector:
    matchLabels:
      app: utracked
  replicas: 1
  template:
    metadata:
      labels:
        app: utracked
    spec:
      containers:
        - name: utracked
          image: "utracked:latest"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9000
              name: grpc
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              valueFrom:
                configMapKeyRef:
                  name: infra-config
                  key: database-url-utracked
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: infra-config
                  key: rmq-url
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: infra-config
                  key: rmq-port
            - name: GRPC_PORT
              value: "9000"
            - name: UTRACKED_SCENARIO_QUEUE_NAME
              value: utracked.scenario
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: utracked
spec:
  type: ClusterIP
  selector:
    app: utracked
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 9000
      targetPort: 9000
      name: grpc
