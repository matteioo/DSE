rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USERNAME:dse}
rabbitmq-password=${RABBITMQ_PASSWORD:dse}

mp.messaging.outgoing.raw-sonar.connector=smallrye-rabbitmq
mp.messaging.outgoing.raw-sonar.exchange.name=d2s.vehicle.sonar.raw
mp.messaging.outgoing.raw-sonar.routing-key=raw

simulator.sonar.publish.interval=${SIMULATOR_SONAR_PUBLISH_INTERVAL:1s}

simulator.vin=${SIMULATOR_VIN:D2S-DEMO-VIN-001}
simulator.position=${SIMULATOR_POSITION:1}
simulator.initial.gap.meters=${SIMULATOR_INITIAL_GAP_METERS:80}
 # About 30 kph
simulator.scenario.base.speed.mps=${SIMULATOR_SCENARIO_BASE_SPEED_MPS:8.3}
 # About 5 kph
simulator.scenario.speed.delta.mps=${SIMULATOR_SCENARIO_SPEED_DELTA_MPS:1.38}
 # About 50 kph
simulator.scenario3.lead.speed.mps=${SIMULATOR_SCENARIO3_LEAD_SPEED_MPS:13.8}
simulator.scenario3.boost.distance.meters=${SIMULATOR_SCENARIO3_BOOST_DISTANCE_METERS:30}
simulator.resume.distance.meters=${SIMULATOR_RESUME_DISTANCE_METERS:150}
simulator.peer.state.max.age.seconds=${SIMULATOR_PEER_STATE_MAX_AGE_SECONDS:3}
simulator.state.publish.interval=${SIMULATOR_STATE_PUBLISH_INTERVAL:500ms}

mp.messaging.outgoing.simulator-state-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.simulator-state-out.exchange.name=d2s.simulator.vehicle-state
mp.messaging.outgoing.simulator-state-out.routing-key=state

mp.messaging.incoming.simulator-state-in.connector=smallrye-rabbitmq
mp.messaging.incoming.simulator-state-in.exchange.name=d2s.simulator.vehicle-state
mp.messaging.incoming.simulator-state-in.queue.name=${SIMULATOR_STATE_QUEUE_NAME:simulator.state.local}
mp.messaging.incoming.simulator-state-in.routing-key=state

mp.messaging.incoming.scenario-command.connector=smallrye-rabbitmq
mp.messaging.incoming.scenario-command.exchange.name=d2s.simulator.scenario
mp.messaging.incoming.scenario-command.exchange.type=fanout
mp.messaging.incoming.scenario-command.queue.name=${SIMULATOR_SCENARIO_QUEUE_NAME:simulator.scenario.local}
mp.messaging.incoming.scenario-command.routing-key=${SIMULATOR_SCENARIO_ROUTING_KEY:scenario}

mp.messaging.incoming.brake-in.connector=smallrye-rabbitmq
mp.messaging.incoming.brake-in.exchange.name=d2s.vehicle.brake
mp.messaging.incoming.brake-in.queue.name=${SIMULATOR_BRAKE_QUEUE_NAME:simulator.brake.local}
mp.messaging.incoming.brake-in.routing-key=${SIMULATOR_BRAKE_ROUTING_KEY:brake.D2S-DEMO-VIN-001}
