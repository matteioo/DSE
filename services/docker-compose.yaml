services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dse
      POSTGRES_PASSWORD: dse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dse"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql

  brakenow:
    build:
      context: brakenow
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    profiles: [app]

  orchestrator:
    build:
      context: orchestrator
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/orchestrator
      QUARKUS_DATASOURCE_USERNAME: dse
      QUARKUS_DATASOURCE_PASSWORD: dse
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles: [app]

  simulator:
    build:
      context: simulator
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    profiles: [app]

  sonar:
    build:
      context: sonar
      dockerfile: Dockerfile
    ports:
      - "8084:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    profiles: [app]

  spider:
    build:
      context: spider
      dockerfile: Dockerfile
    ports:
      - "8085:8080"
    profiles: [app]

  utracked:
    build:
      context: utracked
      dockerfile: Dockerfile
    ports:
      - "8086:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/utracked
      QUARKUS_DATASOURCE_USERNAME: dse
      QUARKUS_DATASOURCE_PASSWORD: dse
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [app]

  whereami:
    build:
      context: whereami
      dockerfile: Dockerfile
    ports:
      - "8087:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    profiles: [app]

  storefront:
    build:
      context: storefront
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    profiles: [app]
