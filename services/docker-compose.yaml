services:
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: dse
      RABBITMQ_DEFAULT_PASS: dse
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dse
      POSTGRES_PASSWORD: dse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dse"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: orchestrator
    ports:
      - "8082:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/orchestrator
      QUARKUS_DATASOURCE_USERNAME: dse
      QUARKUS_DATASOURCE_PASSWORD: dse
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      UTRACKED_URL: http://utracked:8080
      ORCHESTRATOR_SCENARIO_QUEUE_NAME: orchestrator.scenario
      ORCHESTRATOR_RESET_GRACE_SECONDS: 15
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      utracked:
        condition: service_started
    profiles: [app]

  simulator-vehicle-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: simulator
    ports:
      - "8083:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      SIMULATOR_VIN: D2S-DEMO-VIN-001
      SIMULATOR_POSITION: 1
      SIMULATOR_SONAR_PUBLISH_INTERVAL: 1s
      SIMULATOR_STATE_PUBLISH_INTERVAL: 500ms
      SIMULATOR_PEER_STATE_MAX_AGE_SECONDS: 3
      SIMULATOR_STATE_QUEUE_NAME: simulator.state.vehicle-1
      SIMULATOR_SCENARIO_QUEUE_NAME: simulator.scenario.vehicle-1
      SIMULATOR_BRAKENOW_BRAKE_QUEUE_NAME: simulator.brakenow.brake.vehicle-1
      SIMULATOR_BRAKENOW_BRAKE_ROUTING_KEY: brake.D2S-DEMO-VIN-001
    depends_on:
      rabbitmq:
        condition: service_healthy
    profiles: [app]

  simulator-vehicle-2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: simulator
    ports:
      - "8091:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      SIMULATOR_VIN: D2S-DEMO-VIN-002
      SIMULATOR_POSITION: 2
      SIMULATOR_SONAR_PUBLISH_INTERVAL: 1s
      SIMULATOR_STATE_PUBLISH_INTERVAL: 500ms
      SIMULATOR_PEER_STATE_MAX_AGE_SECONDS: 3
      SIMULATOR_STATE_QUEUE_NAME: simulator.state.vehicle-2
      SIMULATOR_SCENARIO_QUEUE_NAME: simulator.scenario.vehicle-2
      SIMULATOR_BRAKENOW_BRAKE_QUEUE_NAME: simulator.brakenow.brake.vehicle-2
      SIMULATOR_BRAKENOW_BRAKE_ROUTING_KEY: brake.D2S-DEMO-VIN-002
    depends_on:
      rabbitmq:
        condition: service_healthy
    profiles: [app]

  sonar-backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: sonar
    ports:
      - "8084:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      SONAR_MODE: backend
      SONAR_RAW_CONSUMER_ENABLED: "true"
      SONAR_RAW_QUEUE_NAME: sonar.raw.backend
    depends_on:
      rabbitmq:
        condition: service_healthy
    profiles: [app]

  spider:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: spider
    ports:
      - "8085:8080"
    environment:
      UTRACKED_URL: http://utracked:8080
      ORCHESTRATOR_URL: http://orchestrator:8080
    profiles: [app]

  utracked:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: utracked
    ports:
      - "8086:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/utracked
      QUARKUS_DATASOURCE_USERNAME: dse
      QUARKUS_DATASOURCE_PASSWORD: dse
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      UTRACKED_SCENARIO_QUEUE_NAME: utracked.scenario
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles: [app]


  brakenow-vehicle-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: brakenow
    ports:
      - "8092:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      BRAKENOW_VIN: D2S-DEMO-VIN-001
      BRAKENOW_SONAR_QUEUE_NAME: brakenow.sonar.vehicle-1
      BRAKENOW_BRAKE_QUEUE_NAME: brakenow.brake.vehicle-1
      BRAKENOW_BRAKE_ROUTING_KEY: brake.D2S-DEMO-VIN-001
      BRAKENOW_SCENARIO_QUEUE_NAME: brakenow.scenario.vehicle-1
    depends_on:
      rabbitmq:
        condition: service_healthy
    profiles: [app]

  brakenow-vehicle-2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: brakenow
    ports:
      - "8093:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      BRAKENOW_VIN: D2S-DEMO-VIN-002
      BRAKENOW_SONAR_QUEUE_NAME: brakenow.sonar.vehicle-2
      BRAKENOW_BRAKE_QUEUE_NAME: brakenow.brake.vehicle-2
      BRAKENOW_BRAKE_ROUTING_KEY: brake.D2S-DEMO-VIN-002
      BRAKENOW_SCENARIO_QUEUE_NAME: brakenow.scenario.vehicle-2
    depends_on:
      rabbitmq:
        condition: service_healthy
    profiles: [ app ]

  whereami-vehicle-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: whereami
    ports:
      - "8087:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      SIMULATOR_BASE_URL: http://simulator-vehicle-1:8080
      WHEREAMI_VIN: D2S-DEMO-VIN-001
      WHEREAMI_POLL_INTERVAL: 1s
    depends_on:
      rabbitmq:
        condition: service_healthy
      simulator-vehicle-1:
        condition: service_started
    profiles: [app]

  whereami-vehicle-2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: whereami
    ports:
      - "8088:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      SIMULATOR_BASE_URL: http://simulator-vehicle-2:8080
      WHEREAMI_VIN: D2S-DEMO-VIN-002
      WHEREAMI_POLL_INTERVAL: 1s
    depends_on:
      rabbitmq:
        condition: service_healthy
      simulator-vehicle-2:
        condition: service_started
    profiles: [ app ]

  sonar-vehicle-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: sonar
    ports:
      - "8089:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      SIMULATOR_BASE_URL: http://simulator-vehicle-1:8080
      SONAR_MODE: vehicle
      SONAR_VIN: D2S-DEMO-VIN-001
      SONAR_POLL_INTERVAL: 1s
    depends_on:
      rabbitmq:
        condition: service_healthy
      simulator-vehicle-1:
        condition: service_started
    profiles: [ app ]

  sonar-vehicle-2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: sonar
    ports:
      - "8090:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      SIMULATOR_BASE_URL: http://simulator-vehicle-2:8080
      SONAR_MODE: vehicle
      SONAR_VIN: D2S-DEMO-VIN-002
      SONAR_POLL_INTERVAL: 1s
    depends_on:
      rabbitmq:
        condition: service_healthy
      simulator-vehicle-2:
        condition: service_started
    profiles: [ app ]

  storefront:
    build:
      context: storefront
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - spider
    profiles: [app]
