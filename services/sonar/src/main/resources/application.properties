# RabbitMQ
rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USERNAME:dse}
rabbitmq-password=${RABBITMQ_PASSWORD:dse}
mp.messaging.outgoing.vehicle-sonar.connector=smallrye-rabbitmq
mp.messaging.outgoing.vehicle-sonar.exchange.name=d2s.vehicle.distance
mp.messaging.outgoing.vehicle-sonar.routing-key=distance

mp.messaging.incoming.raw-sonar.enabled=${SONAR_RAW_CONSUMER_ENABLED:false}
mp.messaging.incoming.raw-sonar.connector=smallrye-rabbitmq
mp.messaging.incoming.raw-sonar.exchange.name=d2s.vehicle.sonar.raw
mp.messaging.incoming.raw-sonar.queue.name=${SONAR_RAW_QUEUE_NAME:sonar.raw.backend}
mp.messaging.incoming.raw-sonar.routing-key=raw

# Simulator SONAR source
sonar.mode=${SONAR_MODE:vehicle}
sonar.vin=${SONAR_VIN:D2S-DEMO-VIN-002}
sonar.poll.interval=${SONAR_POLL_INTERVAL:1s}
quarkus.rest-client.simulator-api.url=${SIMULATOR_BASE_URL:http://localhost:8083}
