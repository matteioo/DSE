# RabbitMQ
rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USERNAME:dse}
rabbitmq-password=${RABBITMQ_PASSWORD:dse}
mp.messaging.outgoing.vehicle-gps.connector=smallrye-rabbitmq
mp.messaging.outgoing.vehicle-gps.exchange.name=d2s.vehicle.gps
mp.messaging.outgoing.vehicle-gps.routing-key=gps

# Simulator GPS source
whereami.vin=${WHEREAMI_VIN:D2S-DEMO-VIN-001}
whereami.poll.interval=${WHEREAMI_POLL_INTERVAL:10s}
quarkus.rest-client.simulator-api.url=${SIMULATOR_BASE_URL:http://localhost:8083}
